# On a release-candidate tag (e.g. v0.7.0-rc1), builds the source tarball and
# convenience binaries and publishes them as a GitHub prerelease. The release
# manager drives the rest from dev/release/release_rc.sh (see docs/releasing.md);
# CI never signs.

name: Terraform Build Release Candidate

on:
  push:
    tags:
      # RC tags only; the final vX.Y.Z tag is published by release.sh.
      - 'v*-rc*'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-release:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # v0.7.0-rc1 -> version=0.7.0, rc=1
          version=${TAG#v}
          version=${version%-rc*}
          rc=${TAG##*-rc}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Build source tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RC: ${{ steps.version.outputs.rc }}
        run: |
          # -rc in the filename, but unpacks to a dir without it so the tree
          # matches the final release.
          dir="apache-iceberg-terraform-${VERSION}"
          tar_gz="apache-iceberg-terraform-${VERSION}-rc${RC}.tar.gz"
          git archive --format=tar.gz --prefix="${dir}/" -o "${tar_gz}" HEAD
          sha512sum "${tar_gz}" > "${tar_gz}.sha512"

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-release-candidate
          path: apache-iceberg-terraform-*.tar.gz*
          if-no-files-found: error

  binary-release:
    name: Build provider binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          version=${version%-rc*}
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.sum

      # Go 1.24+ stamps debug.BuildInfo.Main.Version from local VCS tags.
      # RC jobs run on vX.Y.Z-rcN, so without a vX.Y.Z tag the binary embeds
      # the RC version. The voted binaries are promoted bit-for-bit, so stamp
      # the final version now. This tag is ephemeral and MUST stay local; the
      # published vX.Y.Z tag is created by release.sh only after the vote.
      - name: Create local-only final version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          final_tag="v${VERSION}"
          head_sha="$(git rev-parse HEAD)"

          if git show-ref --verify --quiet "refs/tags/${final_tag}"; then
            existing="$(git rev-parse "${final_tag}^{commit}")"
            if [ "${existing}" != "${head_sha}" ]; then
              echo "::error::Refusing to overwrite ${final_tag}: points at ${existing}, HEAD is ${head_sha}"
              exit 1
            fi
            echo "Reusing existing ${final_tag} at ${head_sha}"
          else
            git tag "${final_tag}" "${head_sha}"
            echo "Created local-only ${final_tag} at ${head_sha}"
          fi

          tagged="$(git rev-parse "${final_tag}^{commit}")"
          if [ "${tagged}" != "${head_sha}" ]; then
            echo "::error::${final_tag} does not point at HEAD ${head_sha}"
            exit 1
          fi

      - name: Build artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          # Build only; signing and publishing happen later.
          args: release --clean --skip=sign,publish,validate
        env:
          # Name artifacts with the final version (0.7.0, not 0.7.0-rc1) so the
          # voted binaries can be promoted unchanged. Skipping validate lets this
          # override GoReleaser's tag-derived version.
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}

      - name: Verify embedded module version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          expected_version="v${VERSION}"
          expected_revision="$(git rev-parse HEAD)"

          shopt -s nullglob
          zips=(dist/terraform-provider-iceberg_"${VERSION}"_*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No provider ZIP artifacts found in dist/"
            exit 1
          fi

          failed=0
          for zip in "${zips[@]}"; do
            tmp="$(mktemp -d)"
            unzip -q -o "${zip}" -d "${tmp}"
            binlist="$(mktemp)"
            find "${tmp}" -type f \( \
              -name "terraform-provider-iceberg_v${VERSION}" -o \
              -name "terraform-provider-iceberg_v${VERSION}.exe" \) \
              > "${binlist}"
            bin_count="$(wc -l < "${binlist}" | tr -d ' ')"
            if [ "${bin_count}" -ne 1 ]; then
              echo "::error::Expected exactly one provider binary in ${zip}, found ${bin_count}"
              failed=1
              rm -rf "${tmp}" "${binlist}"
              continue
            fi

            bin="$(cat "${binlist}")"
            rm -f "${binlist}"
            if ! info="$(go version -m "${bin}")"; then
              echo "::error::go version -m failed for ${zip}"
              failed=1
              rm -rf "${tmp}"
              continue
            fi

            mod_version="$(printf '%s\n' "${info}" | awk -F '\t' '$2 == "mod" { print $4; exit }')"
            vcs_revision="$(printf '%s\n' "${info}" | sed -n 's/^\tbuild\tvcs.revision=//p')"
            vcs_modified="$(printf '%s\n' "${info}" | sed -n 's/^\tbuild\tvcs.modified=//p')"

            echo "Verified ${zip}:"
            echo "  mod=${mod_version}"
            echo "  vcs.revision=${vcs_revision}"
            echo "  vcs.modified=${vcs_modified}"

            if [ -z "${mod_version}" ] || [ -z "${vcs_revision}" ] || [ -z "${vcs_modified}" ]; then
              echo "::error::Incomplete build info in ${zip}"
              failed=1
            elif [ "${mod_version}" != "${expected_version}" ]; then
              echo "::error::${zip}: module version is ${mod_version}, want ${expected_version}"
              failed=1
            elif [ "${vcs_revision}" != "${expected_revision}" ]; then
              echo "::error::${zip}: vcs.revision is ${vcs_revision}, want ${expected_revision}"
              failed=1
            elif [ "${vcs_modified}" != "false" ]; then
              echo "::error::${zip}: vcs.modified is ${vcs_modified}, want false"
              failed=1
            fi
            rm -rf "${tmp}"
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::Embedded module version verification failed"
            exit 1
          fi

      - name: Stage registry manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GoReleaser hashes the manifest into SHA256SUMS but only copies it to
          # dist/ during the skipped publish stage, so stage it here.
          cp terraform-registry-manifest.json \
            "dist/terraform-provider-iceberg_${VERSION}_manifest.json"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-release-candidate
          path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_manifest.json
          if-no-files-found: error

  create-prerelease:
    name: Create GitHub prerelease
    needs:
      - source-release
      - binary-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-release-candidate
          path: artifacts

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-release-candidate
          path: artifacts

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # release_rc.sh adds signatures afterwards; CI never signs.
          gh release create "${TAG}" \
            --prerelease \
            --verify-tag \
            --title "Apache Iceberg Terraform provider ${TAG}" \
            --generate-notes \
            artifacts/*
